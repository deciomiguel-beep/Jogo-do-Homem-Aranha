<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider Run</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TELA DE INTRODUÇÃO ===== -->
  <div class="intro-screen" id="intro-screen">
    <video autoplay muted loop id="intro-video" class="bg-video">
      <source src="./SPIDER RUN.mp4" type="video/mp4" />
      Seu navegador não suporta vídeos.
    </video>
    
    <div class="intro-buttons">
      <button id="help-btn" class="intro-btn">❓ Instruções</button>
      <button id="play-btn" class="intro-btn">▶️ Jogar</button>
    </div>
  </div>

  <!-- ===== SELETOR DE DIFICULDADE ===== -->
  <div id="difficulty-selector" class="hidden">
    <h2>🎮 ESCOLHA A DIFICULDADE</h2>
    <div class="diff-buttons">
      <button class="diff-btn easy" data-diff="easy">
        <span class="diff-icon">🌱</span>
        <span class="diff-name">FÁCIL</span>
        <span class="diff-desc">1 vilão, 2 após 50 pts</span>
      </button>
      <button class="diff-btn medium" data-diff="medium">
        <span class="diff-icon">🔥</span>
        <span class="diff-name">MÉDIO</span>
        <span class="diff-desc">2 vilões + power ups</span>
      </button>
      <button class="diff-btn hard" data-diff="hard">
        <span class="diff-icon">💀</span>
        <span class="diff-name">DIFÍCIL</span>
        <span class="diff-desc">Tudo + vilão voador</span>
      </button>
    </div>
  </div>

  <!-- ===== ÁREA DO JOGO ===== -->
  <div class="game-board hidden" id="game-board">
    <img src="./spiderman.gif" class="spider" id="spider" alt="spider">
    <img src="./venom.png" class="venom" id="venom" alt="venom">
    <img src="./abutre.png" class="venom-fly hidden" id="venom-fly" alt="abutre">
    <div class="score" id="score">Score: 0</div>

    <!-- containers dinâmicos (inseridos pelo JS) -->
  </div>

  <script src="script.js"></script>
</body>
</html>
