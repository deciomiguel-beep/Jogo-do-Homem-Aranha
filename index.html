<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider Run</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TELA DE INTRODUÇÃO ===== -->
  <div class="intro-screen" id="intro-screen">
    <video autoplay muted loop id="intro-video">
      <source src="./spider run.mp4" type="video/mp4" />
      Seu navegador não suporta vídeos.
    </video>

    <div class="device-selector" id="device-selector">
      <h2>📱 ESCOLHA O DISPOSITIVO</h2>
      <div class="device-buttons">
        <button class="device-btn" data-device="celular">📱<br>Celular</button>
        <button class="device-btn" data-device="tablet">📱<br>Tablet</button>
        <button class="device-btn" data-device="computador">💻<br>Computador</button>
      </div>
    </div>

    <div class="intro-buttons hidden" id="intro-buttons">
      <button id="help-btn" class="intro-btn">❓ Instruções</button>
      <button id="play-btn" class="intro-btn">▶️ Jogar</button>
    </div>
  </div>

  <!-- ===== ÁREA DO JOGO ===== -->
  <div class="game-board hidden" id="game-board">
    <img src="./spiderman.gif" class="spider" id="spider" alt="spider">
    <img src="./venom.png" class="venom" id="venom" alt="venom">
    <img src="./abutre.png" class="venom-fly hidden" id="venom-fly" alt="abutre">
    <div class="score" id="score">Score: 0</div>

    <!-- containers dinâmicos (inseridos pelo JS) -->
  </div>

  <script src="script.js"></script>
</body>
</html>
